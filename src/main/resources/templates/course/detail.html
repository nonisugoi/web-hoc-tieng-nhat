<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.title} + ' - Japanese Learning Web'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📚 Japanese Learning Web</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row">
            <!-- Left: Course Info -->
            <div class="col-md-8">
                <h1 id="courseTitle">Loading...</h1>
                <p id="courseDescription" class="text-muted"></p>

                <!-- Lessons Section -->
                <div class="mt-5">
                    <h2>Lessons</h2>
                    <div id="lessonsContainer" class="list-group">
                        <p class="text-center">Loading lessons...</p>
                    </div>
                </div>
            </div>

            <!-- Right: Sidebar -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Course Info</h5>
                        <p><strong>Price:</strong> <span id="coursePrice">-</span></p>
                        <p><strong>Category:</strong> <span id="courseCategory">-</span></p>
                        <p><strong>Lessons:</strong> <span id="lessonCount">0</span></p>
                        <button class="btn btn-success w-100" onclick="enrollCourse()">Enroll Now</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2026 Japanese Learning Web</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const courseId = new URLSearchParams(window.location.search).get('id') || window.location.pathname.split('/').pop();

        // Load course details
        fetch(`/api/courses/${courseId}`)
            .then(response => response.json())
            .then(data => {
                const course = data.data;
                document.getElementById('courseTitle').textContent = course.title;
                document.getElementById('courseDescription').textContent = course.description;
                document.getElementById('coursePrice').textContent = course.isFree ? 'FREE' : `$${course.price}`;
                document.getElementById('courseCategory').textContent = course.categoryName;
                document.getElementById('lessonCount').textContent = course.lessonCount;
            });

        // Load lessons
        fetch(`/api/lessons/course/${courseId}`)
            .then(response => response.json())
            .then(data => {
                let html = '';
                if (data.data && data.data.length > 0) {
                    data.data.forEach((lesson, index) => {
                        html += `
                            <a href="/lessons/${lesson.lessonId}" class="list-group-item list-group-item-action">
                                <h6 class="mb-1">Lesson ${index + 1}: ${lesson.title}</h6>
                                <p class="mb-0 text-muted text-sm">${lesson.content ? lesson.content.substring(0, 80) + '...' : 'No description'}</p>
                            </a>
                        `;
                    });
                } else {
                    html = '<p class="text-center text-muted">No lessons available</p>';
                }
                document.getElementById('lessonsContainer').innerHTML = html;
            });

        function enrollCourse() {
            const userId = prompt('Enter your user ID:');
            if (userId) {
                fetch(`/api/enrollment/${userId}/${courseId}`, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Enrolled successfully!');
                    } else {
                        alert('Error: ' + data.message);
                    }
                });
            }
        }
    </script>
</body>
</html>
