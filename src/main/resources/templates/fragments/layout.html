<head th:fragment="head(title)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Page Title</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="/js/app.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-color: #26bba4;
            --blue-home: #3b82f6;
            --bg-body: #f4f7f6;
            --sidebar-width: 260px;
            --white: #ffffff;
            --text-main: #333;
            --text-gray: #777;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            display: flex;
            min-height: 100vh;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--white);
            border-right: 1px solid #eee;
            position: fixed;
            height: 100vh;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
        }

        .logo { font-size: 22px; font-weight: 800; color: #111; margin-bottom: 30px; padding-left: 10px; }
        .logo span { color: var(--primary-color); }

        .user-box { background: #fff; border: 1px solid #f0f0f0; padding: 15px; border-radius: 12px; margin-bottom: 25px; text-align: center; }
        .user-name { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .user-stats { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .stat-badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        .badge-coins { background: #fff9c4; }
        .badge-gems { background: #e1f5fe; }
        .badge-level { background: #ffebee; color: #ff4757; }

        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 15px; text-decoration: none; color: var(--text-gray); border-radius: 12px; font-size: 15px; transition: 0.3s; font-weight: 500; margin-bottom: 4px; cursor: pointer; }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .nav-item:hover, .nav-item.active { background: #f0fdfa; color: var(--primary-color); }
        .nav-logout { margin-top: auto; padding-top: 15px; border-top: 1px solid #eee; }

        /* ─── MAIN CONTENT ─── */
        .main-content { flex: 1; margin-left: var(--sidebar-width); }
        .top-nav { background: #fff; padding: 12px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .btn-home-blue { background: var(--blue-home); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .nav-text-link { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 500; padding-left: 20px; border-left: 1px solid #ddd; }
        .nav-text-link:first-of-type { border-left: none; padding-left: 0; }
        .logout-btn { background: #ff6b6b; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; transition: 0.3s; width: 100%; text-align: left; }
        .logout-btn:hover { background: #ff5252; transform: translateY(-2px); }

        .container { padding: 30px 50px; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .main-content { margin-left: 70px; }
            .container { padding: 20px; }
        }

        /* ─── DASHBOARD STYLES ─── */
        .riki-banner {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3dd1bb 100%);
            border-radius: 20px;
            padding: 45px 50px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(38, 187, 164, 0.2);
            position: relative;
            overflow: hidden;
        }

        .riki-banner::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -50px;
            right: -50px;
        }

        .banner-info h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .banner-info p {
            font-size: 15px;
            opacity: 0.95;
            margin-bottom: 25px;
            max-width: 450px;
        }

        .banner-btn {
            display: inline-block;
            background: white;
            color: var(--primary-color);
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }

        .banner-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .quick-item {
            background: var(--white);
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow);
            transition: 0.3s;
            cursor: pointer;
        }

        .quick-item:hover {
            transform: translateY(-5px);
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 20px;
        }

        .bg-teal { background: #e8f8f5; color: #26bba4; }
        .bg-blue { background: #eaf2ff; color: #448aff; }
        .bg-orange { background: #fff4e5; color: #ff9800; }
        .bg-red { background: #ffebee; color: #ff5252; }

        .quick-item b {
            display: block;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .quick-item span {
            font-size: 12px;
            color: var(--text-gray);
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .course-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.3s;
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
        }

        .card-content {
            padding: 20px;
        }

        .card-content h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .badge {
            padding: 4px 8px;
            background: #f0f2f5;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-gray);
        }
    </style>
</head>
