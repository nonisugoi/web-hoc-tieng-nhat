<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head()}"></head>
<body>
    <nav th:replace="~{fragments/common :: navbar('courses')}"></nav>
    <main class="container py-5">
        <h1>Courses - Delete</h1>
        <div class="card"><div class="card-body">
            <div class="mb-3">
                <label for="recordId" class="form-label">Record ID</label>
                <input id="recordId" class="form-control" placeholder="Enter ID to delete">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-danger" id="deleteBtn">Delete</button>
                <a class="btn btn-outline-secondary" th:href="@{'/sync/courses/index'}">Back to list</a>
            </div>
            <pre id="deleteResult" class="mt-3 p-3 bg-light border rounded"></pre>
        </div></div>
    </main>
    <footer th:replace="~{fragments/common :: footer}"></footer>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
    <script>
        const apiBase = '/api/courses';
        const params = new URLSearchParams(window.location.search);
        const initialId = params.get('id');
        if (initialId) {
            document.getElementById('recordId').value = initialId;
        }
        document.getElementById('deleteBtn').addEventListener('click', async () => {
            const output = document.getElementById('deleteResult');
            const id = document.getElementById('recordId').value.trim();
            if (!id) {
                output.textContent = 'Error: Record ID is required.';
                return;
            }
            if (!confirm('Confirm delete ID ' + id + '?')) {
                return;
            }
            try {
                const response = await fetch(${apiBase}/, { method: 'DELETE' });
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
