<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${pageTitle})"></head>
<body>
<style>
    :root{--gold:#e07b00;--gold-lt:#fff3e0}
    .rad-banner{background:linear-gradient(135deg,#e07b00 0%,#f59e0b 60%,#fbbf24 100%);border-radius:16px;padding:28px 32px;color:white;display:flex;align-items:center;gap:20px;margin-bottom:24px;box-shadow:0 8px 30px rgba(224,123,0,.3)}
    .rad-icon{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;font-family:'Noto Sans JP',sans-serif;flex-shrink:0}
    .rad-binfo{flex:1}
    .rad-binfo h2{font-size:20px;font-weight:800;margin-bottom:4px}
    .rad-binfo p{font-size:13px;opacity:.8}
    .rad-bstats{display:flex;gap:14px}
    .rstat{text-align:center;background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px}
    .rstat-num{font-size:24px;font-weight:900}
    .rstat-lbl{font-size:11px;opacity:.75}
    .rad-ctrl{display:flex;gap:10px;margin-bottom:16px;align-items:center}
    .rad-inp{flex:1;padding:9px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;outline:none}
    .rad-inp:focus{border-color:var(--gold)}
    .btn-rsch{padding:9px 22px;background:var(--gold);color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
    .btn-rsch:hover{background:#c96c00}
    .stabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .stab{padding:7px 16px;border:1.5px solid #ddd;background:white;border-radius:50px;font-size:12px;font-weight:700;cursor:pointer;color:#555;transition:.15s}
    .stab.active{background:var(--gold);border-color:var(--gold);color:white}
    .stab:not(.active):hover{border-color:var(--gold);color:var(--gold)}
    .rad-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin-bottom:24px}
    @media(max-width:1200px){.rad-grid{grid-template-columns:repeat(6,1fr)}}
    @media(max-width:800px){.rad-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:500px){.rad-grid{grid-template-columns:repeat(2,1fr)}}
    .rad-card{background:var(--gold-lt);border:1.5px solid rgba(224,123,0,.2);border-radius:14px;padding:14px 10px;cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
    .rad-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(224,123,0,.25)}
    .rad-num{font-size:10px;font-weight:700;color:var(--gold);position:absolute;top:8px;left:10px}
    .rad-char{font-size:46px;font-weight:900;color:#4a2500;font-family:'Noto Sans JP',sans-serif;line-height:1;margin:18px 0 6px}
    .rad-strokes{font-size:10px;color:#888}
    .rad-read{font-size:10px;color:#666;font-family:'Noto Sans JP',sans-serif}
    .rad-mean{font-size:12px;font-weight:700;color:#333;margin:2px 0}
    .rad-kw{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
    .rad-kc{font-size:11px;color:#4a2500;font-family:'Noto Sans JP',sans-serif;background:rgba(224,123,0,.12);padding:1px 4px;border-radius:3px}
    .empty-r{text-align:center;padding:60px 20px;color:#888;font-size:15px}
    .pg-r{display:flex;justify-content:center;gap:6px;padding:10px 0 20px;flex-wrap:wrap}
    .pg-r-btn{min-width:36px;height:36px;padding:0 10px;border:1.5px solid var(--gold);background:white;border-radius:8px;font-size:13px;font-weight:700;color:var(--gold);cursor:pointer;transition:.15s}
    .pg-r-btn.active{background:var(--gold);color:white}
    .pg-r-btn:hover:not(:disabled):not(.active){background:var(--gold-lt)}
    .pg-r-btn:disabled{opacity:.35;cursor:not-allowed}
</style>

    <div th:replace="fragments/sidebar :: sidebar('radicals')"></div>
    <main class="main-content">
        <div th:replace="fragments/topbar :: topbar('/dashboard', 'Dashboard', '#', 'Cài đặt')"></div>
        <div class="container">

            <div class="rad-banner">
                <div class="rad-icon">部</div>
                <div class="rad-binfo">
                    <h2>Danh sách Bộ thủ</h2>
                    <p>Học bộ thủ giúp bạn đoán nghĩa Kanji nhanh hơn</p>
                </div>
                <div class="rad-bstats">
                    <div class="rstat">
                        <div class="rstat-num" id="totalRad">0</div>
                        <div class="rstat-lbl">Bộ thủ</div>
                    </div>
                    <div class="rstat">
                        <div class="rstat-num">214</div>
                        <div class="rstat-lbl">Tổng bộ thủ</div>
                    </div>
                </div>
            </div>

            <div class="rad-ctrl">
                <input class="rad-inp" id="radSearch" type="text" placeholder="Tìm bộ thủ, ý nghĩa..." oninput="doRS()">
                <button class="btn-rsch" onclick="doRS()">Tìm kiếm</button>
            </div>

            <div class="stabs">
                <button class="stab active" onclick="setSt('all',this)">Tất cả</button>
                <button class="stab" onclick="setSt('1',this)">1 nét</button>
                <button class="stab" onclick="setSt('2',this)">2 nét</button>
                <button class="stab" onclick="setSt('3',this)">3 nét</button>
                <button class="stab" onclick="setSt('4',this)">4 nét</button>
                <button class="stab" onclick="setSt('5+',this)">5+ nét</button>
            </div>

            <div class="rad-grid" id="radGrid">
                <div th:each="radical, iter : ${radicals}"
                     class="rad-card"
                     th:data-radical="${radical.radical}"
                     th:data-meaning="${radical.meaning}"
                     data-strokes="1">
                    <span class="rad-num" th:text="'#' + ${iter.count}">1</span>
                    <div class="rad-char" th:text="${radical.radical}">一</div>
                    <div class="rad-strokes">✏ 1 nét</div>
                    <div class="rad-read">いち</div>
                    <div class="rad-mean" th:text="${radical.meaning}">Một</div>
                    <div class="rad-kw" th:if="${not #sets.isEmpty(radical.kanjis)}">
                        <span th:each="k : ${radical.kanjis}" class="rad-kc" th:text="${k.character}">字</span>
                    </div>
                </div>
            </div>

            <div id="emptyR" class="empty-r" style="display:none">
                <div style="font-size:52px">🈳</div><p>Không tìm thấy bộ thủ nào</p>
            </div>
            <div class="pg-r" id="paginationR"></div>
        </div>
    </main>

<script>
    const PAGE_R=16;let pageR=1,stFil='all',searchR='';
    function rCards(){return[...document.querySelectorAll('#radGrid .rad-card')]}
    function rVis(){return rCards().filter(el=>{const s=(el.dataset.strokes||'1'),m=(el.dataset.meaning||'').toLowerCase(),r=(el.dataset.radical||'').toLowerCase();const sOk=stFil==='all'||(stFil==='5+'&&parseInt(s)>=5)||s===stFil;return sOk&&(!searchR||r.includes(searchR)||m.includes(searchR))})}
    function renderR(p){const vs=rVis(),tp=Math.max(1,Math.ceil(vs.length/PAGE_R));pageR=Math.min(Math.max(1,p),tp);const s=(pageR-1)*PAGE_R;rCards().forEach(c=>c.style.display='none');vs.slice(s,s+PAGE_R).forEach(c=>c.style.display='');document.getElementById('emptyR').style.display=vs.length===0?'block':'none';document.getElementById('totalRad').textContent=rCards().length;renderPR(tp)}
    function renderPR(tp){const pg=document.getElementById('paginationR');if(!pg||tp<=1){if(pg)pg.innerHTML='';return}let h=`<button class="pg-r-btn" onclick="renderR(${pageR-1})" ${pageR===1?'disabled':''}>←</button>`;for(let i=1;i<=tp;i++)h+=`<button class="pg-r-btn ${i===pageR?'active':''}" onclick="renderR(${i})">${i}</button>`;h+=`<button class="pg-r-btn" onclick="renderR(${pageR+1})" ${pageR===tp?'disabled':''}>→</button>`;pg.innerHTML=h}
    function setSt(s,btn){stFil=s;document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderR(1)}
    function doRS(){searchR=(document.getElementById('radSearch').value||'').toLowerCase().trim();renderR(1)}
    document.addEventListener('DOMContentLoaded',function(){renderR(1);document.getElementById('radSearch').addEventListener('keydown',e=>{if(e.key==='Enter')doRS()})});
</script>
</body>
</html>
