<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabularies - Japanese Learning Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📚 Japanese Learning Web</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
        <h1>Vocabulary Browser</h1>

        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="Search vocabulary...">
            </div>
            <div class="col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="levelFilter" class="form-select">
                    <option value="">All Levels</option>
                    <option value="N5">N5 (Beginner)</option>
                    <option value="N4">N4</option>
                    <option value="N3">N3 (Intermediate)</option>
                    <option value="N2">N2</option>
                    <option value="N1">N1 (Advanced)</option>
                </select>
            </div>
        </div>

        <!-- Vocabulary Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Kanji</th>
                        <th>Hiragana</th>
                        <th>Romaji</th>
                        <th>Meaning</th>
                        <th>Level</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="vocabularyTable">
                    <tr>
                        <td colspan="6" class="text-center">Loading vocabularies...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination">
                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2026 Japanese Learning Web</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let allVocabularies = [];

        // Load vocabularies
        function loadVocabularies() {
            fetch('/api/vocabularies')
                .then(response => response.json())
                .then(data => {
                    allVocabularies = data.data || [];
                    displayVocabularies(allVocabularies);
                });
        }

        function displayVocabularies(vocabularies) {
            let html = '';
            if (vocabularies.length > 0) {
                vocabularies.forEach(vocab => {
                    html += `
                        <tr>
                            <td><strong>${vocab.kanji}</strong></td>
                            <td>${vocab.hiragana}</td>
                            <td>${vocab.romaji}</td>
                            <td>${vocab.meaning}</td>
                            <td><span class="badge bg-info">${vocab.level || '-'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="addToFavorite(${vocab.vocabularyId})">❤️</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                html = '<tr><td colspan="6" class="text-center text-muted">No vocabularies found</td></tr>';
            }
            document.getElementById('vocabularyTable').innerHTML = html;
        }

        // Search
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allVocabularies.filter(v => 
                v.kanji.toLowerCase().includes(searchTerm) ||
                v.meaning.toLowerCase().includes(searchTerm) ||
                v.romaji.toLowerCase().includes(searchTerm)
            );
            displayVocabularies(filtered);
        });

        function addToFavorite(vocabId) {
            alert('Added to favorites!');
        }

        loadVocabularies();
    </script>
</body>
</html>
