<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Lessons Kanji Partial')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('courses')}"></nav>
<main class="container py-5">
  <h1>Kanji Partial</h1>
  <p class="text-muted">Synced placeholder from Lessons/_KanjiPartial.cshtml.</p>
  <div id="kanjiList" class="d-flex flex-wrap gap-2"></div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script>
fetch('/api/kanjis').then(r => r.json()).then(d => {
  const items = d.data || [];
  document.getElementById('kanjiList').innerHTML = items.slice(0, 20).map(x =>
    `<span class="badge bg-primary p-2">${x.character || '?'}</span>`
  ).join('') || '<span class="text-muted">No kanji found.</span>';
}).catch(() => {
  document.getElementById('kanjiList').innerHTML = '<span class="text-danger">Cannot load kanji.</span>';
});
</script>
</body>
</html>
