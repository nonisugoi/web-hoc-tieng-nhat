<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${pageTitle})"></head>
<body>
<style>
    .grammar-controls{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
    .sel-wrap{position:relative}
    .sel-wrap select{appearance:none;padding:9px 34px 9px 13px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-weight:500;background:white;cursor:pointer;min-width:220px;outline:none}
    .sel-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none}
    .g-search-row{display:flex;gap:8px;flex:1}
    .g-inp{flex:1;padding:9px 13px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;outline:none;min-width:180px}
    .g-inp:focus{border-color:var(--primary-color)}
    .btn-gsearch{padding:9px 22px;background:var(--primary-color);color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .btn-gsearch:hover{background:#1fa99d}
    .lvtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .lvtab{padding:7px 18px;border:1.5px solid #ddd;background:white;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;color:#555;transition:.15s}
    .lvtab.active{background:var(--primary-color);border-color:var(--primary-color);color:white}
    .lvtab:not(.active):hover{border-color:var(--primary-color);color:var(--primary-color)}
    .gr-item{background:white;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;border-left:4px solid var(--primary-color);transition:box-shadow .2s}
    .gr-item:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
    .gr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;user-select:none;gap:12px}
    .gr-head-l{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
    .gr-num{min-width:32px;height:32px;border-radius:50%;background:#f0fdfa;color:var(--primary-color);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(38,187,164,.3);flex-shrink:0}
    .gr-title{font-size:17px;font-weight:800;color:#111;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gr-sub{font-size:12px;color:#888;margin-top:2px}
    .gr-head-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .jlpt-pill{background:#6c63ff;color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px}
    .exp-btn{background:#f4f7f6;border:none;color:#888;width:30px;height:30px;border-radius:50%;font-size:12px;cursor:pointer;transition:transform .2s,background .15s;display:flex;align-items:center;justify-content:center}
    .exp-btn.open{transform:rotate(180deg);background:var(--primary-color);color:white}
    .gr-body{padding:0 20px 20px}
    .gr-sec{margin-top:14px}
    .sec-lbl{font-size:10px;font-weight:700;color:#999;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px}
    .sec-lbl-ic{color:var(--primary-color)}
    .struct-box{background:#f0f0ff;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:700;color:#3b3b9e;font-family:'Noto Sans JP',sans-serif}
    .mean-txt{font-size:14px;color:#444;line-height:1.7}
    .ex-row{background:#fff8f8;border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:3px solid #ff6b81}
    .ex-jp{font-size:14px;font-family:'Noto Sans JP',sans-serif;color:#333;line-height:1.7;display:block}
    .empty-g{text-align:center;padding:60px 20px;color:#888}
    .pg-g{display:flex;justify-content:center;gap:6px;padding:20px 0;flex-wrap:wrap}
    .pg-g-btn{min-width:36px;height:36px;padding:0 10px;border:1.5px solid #ddd;background:white;border-radius:8px;font-size:13px;font-weight:700;color:#555;cursor:pointer;transition:.15s}
    .pg-g-btn.active{background:var(--primary-color);border-color:var(--primary-color);color:white}
    .pg-g-btn:hover:not(:disabled):not(.active){border-color:var(--primary-color);color:var(--primary-color)}
    .pg-g-btn:disabled{opacity:.35;cursor:not-allowed}
</style>

    <div th:replace="fragments/sidebar :: sidebar('grammars')"></div>
    <main class="main-content">
        <div th:replace="fragments/topbar :: topbar('/dashboard', 'Dashboard', '#', 'Cài đặt')"></div>
        <div class="container">

            <div class="grammar-controls">
                <div class="sel-wrap">
                    <select id="courseSelect">
                        <option>Tiếng Nhật N5 (Miễn phí)</option>
                    </select>
                </div>
                <div class="g-search-row">
                    <input class="g-inp" id="searchInput" type="text" placeholder="Tìm mẫu ngữ pháp...">
                    <button class="btn-gsearch" onclick="doSearch()">Tìm kiếm</button>
                </div>
            </div>

            <div class="lvtabs">
                <button class="lvtab active" onclick="setLevel('all',this)">Tất cả</button>
                <button class="lvtab" onclick="setLevel('N5',this)">N5</button>
                <button class="lvtab" onclick="setLevel('N4',this)">N4</button>
                <button class="lvtab" onclick="setLevel('N3',this)">N3</button>
            </div>

            <div id="grammarList">
                <div th:each="grammar, iter : ${grammars}"
                     class="gr-item"
                     th:data-level="${grammar.level}"
                     th:data-rule="${grammar.rule}">

                    <div class="gr-head" th:onclick="'toggleG(' + ${iter.index} + ')'">
                        <div class="gr-head-l">
                            <div class="gr-num" th:text="${iter.count}">1</div>
                            <div>
                                <div class="gr-title" th:text="${grammar.rule}">〜は〜です</div>
                                <div class="gr-sub" th:if="${grammar.lesson != null}" th:text="${grammar.lesson.title}"></div>
                            </div>
                        </div>
                        <div class="gr-head-r">
                            <span class="jlpt-pill" th:text="${grammar.level ?: 'N5'}">N5</span>
                            <button class="exp-btn" th:id="'eBtn' + ${iter.index}">▼</button>
                        </div>
                    </div>

                    <div class="gr-body" th:id="'gBody' + ${iter.index}" style="display:none">
                        <div class="gr-sec" th:if="${grammar.rule != null}">
                            <div class="sec-lbl"><span class="sec-lbl-ic">⊞</span> CẤU TRÚC</div>
                            <div class="struct-box" th:text="${grammar.rule}"></div>
                        </div>
                        <div class="gr-sec" th:if="${grammar.example != null}">
                            <div class="sec-lbl"><span class="sec-lbl-ic">↳</span> Ý NGHĨA</div>
                            <div class="mean-txt" th:text="${grammar.example}"></div>
                        </div>
                        <div class="gr-sec" th:if="${grammar.notes != null}">
                            <div class="sec-lbl"><span class="sec-lbl-ic">✓</span> VÍ DỤ</div>
                            <div th:each="line : ${#strings.arraySplit(grammar.notes, '|')}">
                                <div class="ex-row"><span class="ex-jp" th:text="${line}"></span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${grammars == null or grammars.isEmpty()}" class="empty-g">
                    <div style="font-size:52px;margin-bottom:12px">📝</div>
                    <p>Chưa có ngữ pháp trong cơ sở dữ liệu.</p>
                </div>
            </div>

            <div class="pg-g" id="paginationG"></div>
        </div>
    </main>

<script>
    const PAGE_G=8; let pageG=1,levelG='all',searchG='';
    function gRows(){return[...document.querySelectorAll('#grammarList .gr-item')]}
    function gVis(){return gRows().filter(el=>{const lv=(el.dataset.level||'').toUpperCase(),ru=(el.dataset.rule||'').toLowerCase();return(levelG==='all'||lv===levelG)&&(!searchG||ru.includes(searchG))})}
    function renderG(p){const vs=gVis(),tp=Math.max(1,Math.ceil(vs.length/PAGE_G));pageG=Math.min(Math.max(1,p),tp);const s=(pageG-1)*PAGE_G;gRows().forEach(r=>r.style.display='none');vs.slice(s,s+PAGE_G).forEach(r=>r.style.display='');renderPG(tp)}
    function renderPG(tp){const pg=document.getElementById('paginationG');if(!pg||tp<=1){if(pg)pg.innerHTML='';return}let h=`<button class="pg-g-btn" onclick="renderG(${pageG-1})" ${pageG===1?'disabled':''}>←</button>`;for(let i=1;i<=tp;i++)h+=`<button class="pg-g-btn ${i===pageG?'active':''}" onclick="renderG(${i})">${i}</button>`;h+=`<button class="pg-g-btn" onclick="renderG(${pageG+1})" ${pageG===tp?'disabled':''}>→</button>`;pg.innerHTML=h}
    function setLevel(l,btn){levelG=l;document.querySelectorAll('.lvtab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderG(1)}
    function doSearch(){searchG=(document.getElementById('searchInput').value||'').toLowerCase().trim();renderG(1)}
    function toggleG(idx){const b=document.getElementById('gBody'+idx),btn=document.getElementById('eBtn'+idx);if(!b)return;const open=b.style.display!=='none';b.style.display=open?'none':'block';btn.classList.toggle('open',!open)}
    document.addEventListener('DOMContentLoaded',function(){renderG(1);const fb=document.getElementById('gBody0'),fbtn=document.getElementById('eBtn0');if(fb)fb.style.display='block';if(fbtn)fbtn.classList.add('open');document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()})});
</script>
</body>
</html>
