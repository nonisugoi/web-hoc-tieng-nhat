<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Register Course')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('courses')}"></nav>
<main class="container py-5">
  <h1>Register Course</h1>
  <p class="text-muted">Synced placeholder from Account/RegisterCourse.cshtml.</p>
  <div class="card"><div class="card-body">
    <label class="form-label">User ID</label>
    <input id="userId" class="form-control mb-2" value="1" />
    <label class="form-label">Course ID</label>
    <input id="courseId" class="form-control mb-2" value="1" />
    <button class="btn btn-success" id="enrollBtn">Enroll</button>
    <pre id="enrollResult" class="mt-3 p-3 bg-light border rounded"></pre>
  </div></div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script>
document.getElementById('enrollBtn').addEventListener('click', async ()=>{
 const userId = document.getElementById('userId').value;
 const courseId = document.getElementById('courseId').value;
 const res = await fetch(`/api/enrollment/${userId}/${courseId}`, { method: 'POST' });
 const data = await res.json();
 document.getElementById('enrollResult').textContent = JSON.stringify(data,null,2);
});
</script>
</body>
</html>
