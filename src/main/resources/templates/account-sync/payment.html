<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Account Payment')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('my-courses')}"></nav>
<main class="container py-5">
  <h1>Account Payment</h1>
  <p class="text-muted">Synced placeholder from Account/Payment.cshtml.</p>
  <div class="card"><div class="card-body">
    <label class="form-label">Course ID</label>
    <input id="courseId" class="form-control mb-2" value="1" />
    <label class="form-label">Amount</label>
    <input id="amount" class="form-control mb-2" value="100000" />
    <button class="btn btn-primary" id="payBtn">Create MoMo Payment</button>
    <pre id="payResult" class="mt-3 p-3 bg-light border rounded"></pre>
  </div></div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script>
document.getElementById('payBtn').addEventListener('click', async ()=>{
 const payload = { courseId: Number(document.getElementById('courseId').value), amount: Number(document.getElementById('amount').value), voucherCode: '' };
 const res = await fetch('/api/payment/momo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const data = await res.json();
 document.getElementById('payResult').textContent = JSON.stringify(data,null,2);
});
</script>
</body>
</html>
