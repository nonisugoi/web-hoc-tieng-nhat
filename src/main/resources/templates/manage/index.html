<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Manage CRUD')}"></head>
<body>
    <nav th:replace="~{fragments/common :: navbar('courses')}"></nav>

    <main class="container py-5">
        <h1 class="mb-4">CRUD Management</h1>
        <p class="text-muted">Choose a module to manage list, create, edit, and delete actions.</p>

        <div class="row g-3 mt-2">
            <div class="col-md-4" th:each="item : ${#arrays.array('courses','lessons','quizzes','kanjis','vocabularies')}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-capitalize" th:text="${item}">courses</h5>
                        <p class="card-text text-muted">Manage <span th:text="${item}"></span> data.</p>
                        <a class="btn btn-primary mt-auto" th:href="@{'/manage/' + ${item}}">Open</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
