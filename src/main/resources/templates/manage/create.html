<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body th:attr="data-api-base=${apiBase}">
    <nav th:replace="~{fragments/common :: navbar('courses')}"></nav>

    <main class="container py-5">
        <h1 class="text-capitalize" th:text="'Create ' + ${entity}"></h1>
        <p class="text-muted">Submit raw JSON payload to <span th:text="${apiBase}"></span>.</p>

        <div class="card">
            <div class="card-body">
                <label for="payload" class="form-label">JSON payload</label>
                <textarea id="payload" class="form-control" rows="14" spellcheck="false">{
  "title": "Sample"
}</textarea>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-success" id="createBtn">Create</button>
                    <a class="btn btn-outline-secondary" th:href="@{'/manage/' + ${entity}}">Back to list</a>
                </div>
                <pre id="createResult" class="mt-3 p-3 bg-light border rounded"></pre>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
    <script>
        const apiBase = document.body.dataset.apiBase;
        document.getElementById('createBtn').addEventListener('click', async () => {
            const output = document.getElementById('createResult');
            try {
                const body = JSON.parse(document.getElementById('payload').value);
                const response = await fetch(apiBase, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
