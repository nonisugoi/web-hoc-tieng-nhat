<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Danh sach khoa hoc')}"></head>
<body>
    <nav th:replace="~{fragments/common :: navbar('courses')}"></nav>

    <main class="container my-5" style="max-width: 1100px;">
        <div class="card shadow-sm" style="border-radius: 16px;">
            <div class="text-center text-white" style="background: #17b6b7; border-radius: 16px 16px 0 0; font-weight: 700; font-size: 1.15rem; padding: 16px 20px;">
                Danh sach khoa hoc
            </div>
            <div class="card-body">
                <div class="row g-4" id="homeCourseLessonList">
                    <div class="col-12 text-muted">Dang tai khoa hoc...</div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
    <script>
        fetch('/api/courses')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('homeCourseLessonList');
                if (!data.data || data.data.length === 0) {
                    container.innerHTML = '<div class="col-12 text-muted">Khong co khoa hoc.</div>';
                    return;
                }

                let html = '';
                data.data.forEach(course => {
                    const priceHtml = course.isFree
                        ? '<span class="badge bg-success">Mien phi</span>'
                        : `<span class="text-danger fw-semibold">${course.price || 0} VND</span>`;

                    html += `
                        <div class="col-md-6 col-lg-4">
                            <div class="p-3 h-100" style="background: #fcfdff; border-radius: 14px; box-shadow: 0 4px 14px rgba(23, 182, 183, 0.08); display: flex; flex-direction: column;">
                                <div style="font-size: 1.15rem; font-weight: 700; color: #17b6b7;" class="mb-2">${course.title}</div>
                                <div class="mb-2 text-muted">${course.description || ''}</div>
                                <div class="mb-3"><strong>Gia:</strong> ${priceHtml}</div>
                                <div class="mt-auto text-center">
                                    <a href="/lessons/${course.courseId}" class="btn text-white" style="background: #17b6b7; border-radius: 30px;">Vao hoc</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('homeCourseLessonList').innerHTML = '<div class="col-12 text-danger">Khong tai duoc du lieu khoa hoc.</div>';
            });
    </script>
</body>
</html>
