<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${pageTitle})"></head>
<body>
<style>
    .cs-banner{background:linear-gradient(135deg,#1e3a2e 0%,#0f4a3a 100%);border-radius:16px;padding:32px;color:white;display:flex;align-items:center;gap:24px;margin-bottom:30px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
    .cs-bicon{font-size:48px;background:rgba(255,255,255,.15);width:80px;height:80px;display:flex;align-items:center;justify-content:center;border-radius:20px}
    .cs-btxt h2{font-size:24px;font-weight:900;margin-bottom:6px}
    .cs-btxt p{font-size:14px;opacity:.8}

    .cs-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:24px;margin-bottom:40px}
    .cs-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08);transition:all .3s ease;cursor:pointer;position:relative;border:1px solid #f0f0f0}
    .cs-card:hover{transform:translateY(-10px);box-shadow:0 20px 40px rgba(0,0,0,.15);border-color:var(--primary-color)}
    
    .cs-card-header{height:140px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;color:white;position:relative}
    .cs-lvl{font-size:12px;font-weight:900;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:4px 12px;border-radius:50px;width:fit-content;border:1px solid rgba(255,255,255,.3)}
    .cs-enrolled{position:absolute;top:10px;right:10px;background:#38ef7d;color:white;font-size:10px;font-weight:900;padding:4px 10px;border-radius:50px;box-shadow:0 4px 10px rgba(0,0,0,.15);text-transform:uppercase;letter-spacing:1px}
    
    .cs-card-body{padding:24px}
    .cs-title{font-size:18px;font-weight:800;color:#111;margin-bottom:10px}
    .cs-desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:20px;height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    
    .cs-meta{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f0f0;padding-top:20px}
    .cs-stat{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#444}
    .cs-stat i{color:var(--primary-color);font-size:16px}
    
    .btn-select{background:var(--primary-color);color:white;border:none;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:800;transition:.2s}
    .cs-card:hover .btn-select{background:#1fa99d;padding:10px 25px}

    .gradients-ls {
        --g1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --g2: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        --g3: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --g4: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
</style>

<div th:replace="fragments/sidebar :: sidebar('lessons')"></div>
<main class="main-content">
    <div th:replace="fragments/topbar :: topbar('/dashboard', 'Dashboard', '#', 'Cài đặt')"></div>
    <div class="container">
        
        <!-- Grid -->
        <div class="cs-grid">
            <div th:each="course, iter : ${courses}" class="cs-card" 
                 th:onclick="'window.location.href=\'/lessons/course/' + ${course.courseId} + '\''">
                
                <!-- Random Gradient Header -->
                <div class="cs-card-header" 
                     th:style="'background:' + (${iter.index % 4 == 0 ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : 
                                               (iter.index % 4 == 1 ? 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' : 
                                               (iter.index % 4 == 2 ? 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)' : 
                                                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'))})">
                    <span class="cs-enrolled" th:if="${enrolledCourseIds != null and enrolledCourseIds.contains(course.courseId)}">Đã đăng ký</span>
                    <span class="cs-lvl" th:text="${course.title != null and course.title.contains('N5') ? 'N5' : 
                                                   (course.title != null and (course.title.contains('N4') or course.title.contains('N4')) ? 'N4' : 'JLPT')}">N5</span>
                    <div style="font-size:24px">📖</div>
                </div>

                <div class="cs-card-body">
                    <div class="cs-title" th:text="${course.title}">Tên khóa học</div>
                    <div class="cs-desc" th:text="${course.description}">Mô tả ngắn gọn về khóa học này.</div>
                    
                    <div class="cs-meta">
                        <div class="cs-stat">
                            <span>📚 <strong th:text="${course.lessons != null ? course.lessons.size() : '0'}">25</strong> bài học</span>
                        </div>
                        <button class="btn-select">Vào học →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${courses == null or courses.isEmpty()}" style="text-align:center;padding:100px 0;color:#aaa">
            <div style="font-size:64px;margin-bottom:20px">📦</div>
            <h3>Hiện chưa có khóa học nào.</h3>
            <p>Vui lòng đăng ký thêm khóa học trong Dashboard hoặc liên hệ admin.</p>
            <a href="/dashboard" class="btn-select" style="display:inline-block;margin-top:20px;text-decoration:none">Về Dashboard →</a>
        </div>
    </div>
</main>
</body>
</html>
