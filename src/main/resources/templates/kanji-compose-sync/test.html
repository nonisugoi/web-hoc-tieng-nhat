<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Kanji Compose Test')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('courses')}"></nav>
<main class="container py-5">
  <h1>Kanji Compose Test</h1>
  <p class="text-muted">Synced from KanjiCompose/Test.cshtml.</p>
  <div class="card"><div class="card-body">
    <div class="mb-3">
      <label class="form-label">Enter Kanji</label>
      <input id="kanjiInput" class="form-control" maxlength="1" placeholder="Type one kanji" />
    </div>
    <button class="btn btn-primary" id="previewBtn">Preview Stroke</button>
    <svg id="kanjiSvg" width="220" height="220" style="border: 1px solid #ccc; margin-top: 16px;"></svg>
  </div></div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script>
document.getElementById('previewBtn').addEventListener('click', async () => {
  const character = document.getElementById('kanjiInput').value.trim();
  const svg = document.getElementById('kanjiSvg');
  svg.innerHTML = '';
  if (!character) {
    Notification.warning('Please input one kanji.');
    return;
  }
  try {
    const res = await fetch(`/KanjiStroke/GetStrokeData?character=${encodeURIComponent(character)}`);
    const json = await res.json();
    if (!json.success) {
      Notification.error(json.message || 'No stroke data found.');
      return;
    }
    json.data.strokes.forEach((stroke) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', stroke.d);
      path.setAttribute('stroke', stroke.color || '#000');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);
    });
  } catch (error) {
    Notification.error('Cannot load stroke data: ' + error.message);
  }
});
</script>
</body>
</html>
