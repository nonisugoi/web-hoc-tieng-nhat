<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Forgot Password - Japanese Learning Web')}"></head>
<body>
    <nav th:replace="~{fragments/common :: navbar('login')}"></nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-3">Forgot Password</h2>
                        <p class="text-muted text-center">Enter your email and we will send reset instructions.</p>
                        <form id="forgotForm">
                            <div class="mb-3">
                                <label for="forgotEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="forgotEmail" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(event) {
            event.preventDefault();
            Notification.info('Reset password UI is synchronized. Integrate email flow next.');
        });
    </script>
</body>
</html>
