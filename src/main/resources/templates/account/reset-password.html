<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Học tiếng Nhật</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',sans-serif;margin:0;padding:20px}
        .reset-container{background:white;border-radius:20px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.1);text-align:center}
        .reset-icon{font-size:64px;margin-bottom:20px}
        .reset-title{font-size:24px;font-weight:700;color:#333;margin-bottom:8px}
        .reset-desc{font-size:14px;color:#666;margin-bottom:32px;line-height:1.5}
        .form-group{margin-bottom:24px;text-align:left}
        .form-label{font-size:14px;font-weight:600;color:#333;margin-bottom:8px;display:block}
        .form-control{width:100%;padding:14px 16px;border:2px solid #e1e5e9;border-radius:10px;font-size:16px;outline:none;transition:.3s;font-family:'Noto Sans JP',sans-serif}
        .form-control:focus{border-color:#667eea}
        .password-strength{margin-top:8px;font-size:12px;display:none}
        .strength-weak{color:#dc3545}
        .strength-medium{color:#ffc107}
        .strength-strong{color:#28a745}
        .btn-reset{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:16px 32px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;width:100%;transition:.3s;font-family:'Noto Sans JP',sans-serif}
        .btn-reset:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}
        .btn-reset:disabled{background:#ccc;cursor:not-allowed;transform:none}
        .back-link{display:block;margin-top:24px;text-decoration:none;color:#667eea;font-size:14px;font-weight:500;transition:.3s}
        .back-link:hover{color:#764ba2}
        .success-message{background:#d4edda;color:#155724;padding:16px;border-radius:10px;border:1px solid #c3e6cb;margin-bottom:24px;display:none}
        .error-message{background:#f8d7da;color:#721c24;padding:16px;border-radius:10px;border:1px solid #f5c6cb;margin-bottom:24px;display:none}
        .loading{display:none;margin-top:16px}
        .loading::after{content:'';width:20px;height:20px;border:2px solid #f3f3f3;border-top:2px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .password-requirements{margin-top:16px;padding:16px;background:#f8f9fa;border-radius:10px;text-align:left}
        .requirement{font-size:12px;color:#666;margin-bottom:4px;display:flex;align-items:center}
        .requirement::before{content:'❌';margin-right:8px;color:#dc3545}
        .requirement.valid::before{content:'✅';color:#28a745}
        .requirement.valid{color:#28a745}
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-icon">🔑</div>
        <h1 class="reset-title">Đặt lại mật khẩu</h1>
        <p class="reset-desc">
            Nhập mật khẩu mới cho tài khoản của bạn. Mật khẩu phải có ít nhất 8 ký tự.
        </p>

        <div id="successMessage" class="success-message">
            ✅ Mật khẩu đã được đặt lại thành công! <a href="/login" style="color:#155724;text-decoration:underline;">Đăng nhập ngay</a>
        </div>

        <div id="errorMessage" class="error-message">
            ❌ Có lỗi xảy ra. Vui lòng thử lại.
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required minlength="8">
                <div id="passwordStrength" class="password-strength"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
            </div>

            <div class="password-requirements">
                <div class="requirement" id="req-length">Ít nhất 8 ký tự</div>
                <div class="requirement" id="req-uppercase">Ít nhất 1 chữ hoa</div>
                <div class="requirement" id="req-lowercase">Ít nhất 1 chữ thường</div>
                <div class="requirement" id="req-number">Ít nhất 1 số</div>
                <div class="requirement" id="req-match">Mật khẩu khớp nhau</div>
            </div>

            <button type="submit" id="submitBtn" class="btn-reset">
                Đặt lại mật khẩu
            </button>
        </form>

        <div id="loading" class="loading"></div>

        <a href="/login" class="back-link">← Quay lại đăng nhập</a>
    </div>

    <script>
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordStrength = document.getElementById('passwordStrength');
        const requirements = {
            length: document.getElementById('req-length'),
            uppercase: document.getElementById('req-uppercase'),
            lowercase: document.getElementById('req-lowercase'),
            number: document.getElementById('req-number'),
            match: document.getElementById('req-match')
        };

        function checkPasswordStrength(password) {
            const hasLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /\d/.test(password);

            // Update requirements
            requirements.length.classList.toggle('valid', hasLength);
            requirements.uppercase.classList.toggle('valid', hasUppercase);
            requirements.lowercase.classList.toggle('valid', hasLowercase);
            requirements.number.classList.toggle('valid', hasNumber);

            // Calculate strength
            let strength = 0;
            if (hasLength) strength++;
            if (hasUppercase) strength++;
            if (hasLowercase) strength++;
            if (hasNumber) strength++;

            // Update strength display
            if (password.length === 0) {
                passwordStrength.style.display = 'none';
            } else {
                passwordStrength.style.display = 'block';
                if (strength < 2) {
                    passwordStrength.textContent = 'Mật khẩu yếu';
                    passwordStrength.className = 'password-strength strength-weak';
                } else if (strength < 4) {
                    passwordStrength.textContent = 'Mật khẩu trung bình';
                    passwordStrength.className = 'password-strength strength-medium';
                } else {
                    passwordStrength.textContent = 'Mật khẩu mạnh';
                    passwordStrength.className = 'password-strength strength-strong';
                }
            }

            return hasLength && hasUppercase && hasLowercase && hasNumber;
        }

        function checkPasswordMatch() {
            const password = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const matches = password === confirmPassword && password.length > 0;
            requirements.match.classList.toggle('valid', matches);
            return matches;
        }

        newPasswordInput.addEventListener('input', function() {
            checkPasswordStrength(this.value);
            checkPasswordMatch();
        });

        confirmPasswordInput.addEventListener('input', function() {
            checkPasswordMatch();
        });

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            // Validate passwords
            if (!checkPasswordStrength(newPassword)) {
                errorMessage.textContent = '❌ Mật khẩu không đủ mạnh. Vui lòng chọn mật khẩu khác.';
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                return;
            }

            if (!checkPasswordMatch()) {
                errorMessage.textContent = '❌ Mật khẩu xác nhận không khớp.';
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                return;
            }

            // Hide messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';

            // Show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang đặt lại...';
            loading.style.display = 'block';

            // Get token from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        token: token,
                        newPassword: newPassword 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successMessage.style.display = 'block';
                    document.getElementById('resetForm').reset();
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    errorMessage.textContent = '❌ ' + (data.message || 'Token không hợp lệ hoặc đã hết hạn.');
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = '❌ Lỗi kết nối mạng. Vui lòng thử lại.';
                errorMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Đặt lại mật khẩu';
                loading.style.display = 'none';
            }
        });

        // Auto-focus password field
        document.addEventListener('DOMContentLoaded', function() {
            newPasswordInput.focus();
        });
    </script>
</body>
</html>
