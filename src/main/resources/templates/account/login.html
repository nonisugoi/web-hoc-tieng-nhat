<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPANESE LEARNING - Premium Experience</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2DD4BF;
            --primary-dark: #0D9488;
            --accent: #F4D03F;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #E0F7FA 0%, #80DEEA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── ANIMATIONS ── */
        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px;
            width: 90%;
            max-width: 1300px;
            z-index: 10;
        }

        /* ── LEFT SECTION (THE ILLUSTRATION) ── */
        .left-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-area {
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
        }
        .logo-text {
            font-size: 28px; font-weight: 900; color: var(--primary-dark);
            text-transform: uppercase; letter-spacing: -1px;
        }

        .hero-text {
            font-size: 42px; font-weight: 900; color: var(--text-dark);
            line-height: 1.2; margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.5);
        }

        /* Khung chứa hình ảnh minh họa */
        .illustration-wrapper {
            position: relative;
            width: 550px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hình ảnh nhân vật */
        .character-img {
            width: 100%;
            height: auto;
            z-index: 5;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.2));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .character-img:hover {
            transform: scale(1.05);
        }

        /* Các icon học tập bay xung quanh */
        .floating-icon {
            position: absolute;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 800;
            color: var(--primary-dark);
            animation: floating 4s infinite ease-in-out;
            border: 1px solid white;
            z-index: 10;
        }
        
        .icon-jlpt { top: -5%; right: 5%; animation-delay: 0s; color: #e74c3c; font-size: 1.1rem; }
        .icon-book { top: 15%; left: -10%; animation-delay: 1s; }
        .icon-idea { bottom: 15%; right: -5%; animation-delay: 2s; }

        /* ── RIGHT SECTION (LOGIN CARD) ── */
        .right-card {
            flex: 0 0 420px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 35px; padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            border: 1px solid white;
        }

        .login-title { font-size: 28px; font-weight: 800; color: var(--text-dark); text-align: center; margin-bottom: 35px; }
        .form-group { margin-bottom: 20px; }
        .input-box { position: relative; }
        .input-box input {
            width: 100%; padding: 16px 15px 16px 50px;
            border: 2px solid #f0f3f5; border-radius: 15px;
            background: #f8fafb; outline: none; transition: 0.3s;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
        }
        .input-box input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.1); }
        .input-box input::placeholder { color: #bdc3c7; }
        .field-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; color: #bdc3c7; }

        .btn-submit {
            width: 100%; padding: 18px; margin-top: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff; border: none; border-radius: 15px;
            font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(13, 148, 136, 0.3); }

        .divider { text-align: center; color: #95a5a6; font-size: 14px; margin-top: 25px; }
        .divider a { color: var(--primary-dark); font-weight: 800; text-decoration: none; }
        .divider a:hover { text-decoration: underline; }

        /* ── NOTIFICATIONS ── */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            max-width: 400px;
        }

        .notification.success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .notification.error {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .notification.info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .notification.removing {
            animation: slideOut 0.3s ease-out;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 1100px) {
            .page-container { flex-direction: column; gap: 50px; padding: 60px 20px; overflow-y: auto; }
            .left-content { align-items: center; text-align: center; }
            .illustration-wrapper { width: 100%; max-width: 450px; height: auto; }
            .notification { max-width: calc(100% - 40px); right: 20px; left: 20px; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="left-content">
            <div class="logo-area">
                <svg width="45" height="45" viewBox="0 0 40 40">
                    <rect width="40" height="40" rx="12" fill="var(--primary)"/>
                    <path d="M12 12L22 20L12 28" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="logo-text">Japanese Learning</span>
            </div>
            
            <h1 class="hero-text">
                Chinh phục JLPT<br>
                Mở lối tương lai<br>
                Cùng chuyên gia.
            </h1>

            <div class="illustration-wrapper">
                <div class="floating-icon icon-jlpt">JLPT N2</div>
                <div class="floating-icon icon-book">📚 Từ vựng</div>
                <div class="floating-icon icon-idea">💡 Ngữ pháp</div>
                    <img th:src="@{/assets/nhan-vat.png}" alt="Learning Character" class="character-img">
            </div>
        </div>

        <div class="right-card">
            <h2 class="login-title">Đăng nhập học viên</h2>
            
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <div class="input-box">
                        <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-width="2"/></svg>
                        <input type="email" name="email" placeholder="Email của bạn" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-width="2"/></svg>
                        <input type="password" name="password" placeholder="Mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">BẮT ĐẦU HỌC NGAY</button>
                <p class="divider">
                    Chưa có tài khoản? <a th:href="@{/register}">Đăng ký tham gia</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        // Handle form submission with AJAX
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            
            try {
                // Show loading notification
                showNotification('Đang xử lý...', 'info');
                
                // Submit form to API
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('✓ ' + data.message, 'success');
                    if (data.redirect) {
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 1500);
                    }
                } else {
                    showNotification('✗ ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('✗ Lỗi kết nối: ' + error.message, 'error');
            }
        });

        // Show notification function
        function showNotification(message, type = 'info') {
            // Remove existing notifications
            document.querySelectorAll('.notification').forEach(n => {
                if (!n.classList.contains('removing')) {
                    n.classList.add('removing');
                    setTimeout(() => n.remove(), 300);
                }
            });
            
            // Create new notification
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Auto remove after 4 seconds
            setTimeout(() => {
                notification.classList.add('removing');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }

        // Show flash message if exists from backend
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const success = params.get('success');
            const error = params.get('error');
            
            if (success) {
                showNotification('✓ ' + decodeURIComponent(success), 'success');
            }
            if (error) {
                showNotification('✗ ' + decodeURIComponent(error), 'error');
            }
        });
    </script>

</body>
</html>
