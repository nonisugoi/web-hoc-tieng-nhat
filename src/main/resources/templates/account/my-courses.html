<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('My Courses - Japanese Learning Web')}"></head>
<body>
    <nav th:replace="~{fragments/common :: navbar('my-courses')}"></nav>

    <main class="container py-5">
        <h1 class="mb-4">My Courses</h1>
        <p class="text-muted">Courses you enrolled in will appear below.</p>

        <div id="myCoursesContainer" class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <p class="mb-0 text-muted">Loading enrolled courses...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
    <script>
        const userId = localStorage.getItem('userId') || '1';
        fetch(`/api/user/${userId}/courses`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('myCoursesContainer');
                if (!data.data || data.data.length === 0) {
                    container.innerHTML = '<div class="col-12"><div class="alert alert-info">You have not enrolled in any courses yet.</div></div>';
                    return;
                }

                let html = '';
                data.data.forEach(enrollment => {
                    html += `
                        <div class="col-md-6 mb-4">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${enrollment.courseTitle}</h5>
                                    <p class="card-text mb-2">Progress: ${enrollment.lessonsCompleted}/${enrollment.totalLessons} lessons</p>
                                    <a href="/courses/${enrollment.courseId}" class="btn btn-primary btn-sm">Go to course</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('myCoursesContainer').innerHTML = '<div class="col-12"><div class="alert alert-warning">Unable to load courses right now.</div></div>';
            });
    </script>
</body>
</html>
