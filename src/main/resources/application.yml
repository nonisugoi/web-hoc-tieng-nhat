spring:
  application:
    name: japanese-learning-web
  
  # Database Configuration (MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/defaultdb?sslMode=REQUIRED}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        use_sql_comments: true
    show-sql: true
    open-in-view: false
  
  # Jackson Configuration (JSON Processing)
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # Thymeleaf Configuration
  thymeleaf:
    cache: false   # Disable template cache so changes apply without server restart

  # Mail Configuration (Email Service)
  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m

# Logging Configuration
logging:
  level:
    root: INFO
    com.japaneseLearning: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10

# Security Configuration
security:
  jwt:
    secret: your-secret-key-minimum-256-bits-long-for-security-purposes-change-in-production
    expiration: 86400000  # 24 hours in milliseconds

# External API Configuration
external-api:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3-flash-preview
  
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    model: mistralai/mistral-7b-instruct
  
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
  
  momo:
    api-url: https://test-payment.momo.vn/gw_payment/transactionProcessor
    secret-key: ${MOMO_SECRET_KEY}
    access-key: ${MOMO_ACCESS_KEY}
    partner-code: MOMO
    request-type: captureMoMoWallet
    return-url: ${MOMO_RETURN_URL}
    notify-url: ${MOMO_NOTIFY_URL}

# Actuator Configuration (Health Check, Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
